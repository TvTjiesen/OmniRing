[versions]
agp = "9.1.0"
kotlin = "2.3.20"
ksp = "2.3.6"
yukihookapi = "1.3.0"
kavaref = "1.0.2"
compose-bom = "2025.06.00"
miuix = "0.9.2"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

[libraries]
yukihookapi-api = { module = "com.highcapable.yukihookapi:api", version.ref = "yukihookapi" }
yukihookapi-ksp-xposed = { module = "com.highcapable.yukihookapi:ksp-xposed", version.ref = "yukihookapi" }
kavaref-core = { module = "com.highcapable.kavaref:kavaref-core", version.ref = "kavaref" }
kavaref-extension = { module = "com.highcapable.kavaref:kavaref-extension", version.ref = "kavaref" }
xposed-api = { module = "de.robv.android.xposed:api", version = "82" }
# LSPosed 2.x 的 MODERN 模块声明（targetApiVersion>=101）要用它提供的 XposedModule 作入口。
# 102：从这一版起框架不许模块再解析 de.robv.android.xposed.*，所以 hook 层自己实现了
# （见 hook/CrownHooks.kt），依赖必须跟着 102 走，否则编译期拿到的是 101 的接口。
libxposed-api = { module = "io.github.libxposed:api", version = "102.0.0" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-animation = { module = "androidx.compose.animation:animation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons = { module = "androidx.compose.material:material-icons-core" }
compose-activity = { module = "androidx.activity:activity-compose", version = "1.10.1" }
compose-navigation = { module = "androidx.navigation:navigation-compose", version = "2.9.0" }

miuix = { module = "top.yukonga.miuix.kmp:miuix-ui-android", version.ref = "miuix" }
miuix-core = { module = "top.yukonga.miuix.kmp:miuix-core-android", version.ref = "miuix" }
miuix-blur = { module = "top.yukonga.miuix.kmp:miuix-blur-android", version.ref = "miuix" }
miuix-icons = { module = "top.yukonga.miuix.kmp:miuix-icons-android", version.ref = "miuix" }
miuix-preference = { module = "top.yukonga.miuix.kmp:miuix-preference-android", version.ref = "miuix" }

junit = { module = "junit:junit", version = "4.13.2" }
